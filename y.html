<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Streamer</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 700px; margin: 0 auto; padding: 20px; background: #121212; color: #fff; }
        h1 { font-size: 1.5rem; margin-bottom: 16px; }
        .search-box { display: flex; gap: 8px; margin-bottom: 20px; }
        input { flex: 1; padding: 12px; border: none; border-radius: 8px; background: #282828; color: #fff; font-size: 16px; outline: none; }
        input:focus { background: #333; }
        button { padding: 12px 20px; border: none; border-radius: 8px; background: #1db954; color: #000; font-weight: 600; cursor: pointer; font-size: 16px; }
        button:hover { background: #1ed760; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        #status { color: #aaa; font-size: 14px; margin-bottom: 12px; min-height: 20px; }
        .track { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 8px; cursor: pointer; transition: background 0.15s; }
        .track:hover { background: #282828; }
        .track.active { background: #1db95422; border-left: 3px solid #1db954; }
        .track img { width: 48px; height: 48px; border-radius: 4px; object-fit: cover; }
        .track .info { flex: 1; min-width: 0; }
        .track .title { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .track .artist { font-size: 13px; color: #aaa; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .track .duration { font-size: 13px; color: #888; }
        #player { width: 100%; margin-top: 16px; border-radius: 8px; }
        #waveCanvas { width: 100%; height: 120px; margin-top: 16px; border-radius: 8px; background: #1a1a1a; display: none; }
        .error { color: #ff6b6b; }
        .loader { text-align: center; color: #aaa; padding: 12px; font-size: 14px; }
    </style>
</head>
<body>
    <h1>🎵 Music Streamer</h1>
    <div class="search-box">
        <input type="text" id="query" placeholder="Поиск трека или исполнителя..." />
        <button id="searchBtn">Найти</button>
    </div>
    <div id="status"></div>
    <div id="results"></div>
    <audio id="player" controls style="display: none;"></audio>
    <canvas id="waveCanvas"></canvas>

<script>
    const INSTANCES = [
        'https://pipedapi.kavin.rocks',
        'https://pipedapi.leptons.xyz',
        'https://pipedapi.nosebs.ru',
        'https://piped-api.privacy.com.de',
        'https://pipedapi.adminforge.de'
    ];

    let currentInstanceIndex = 0;
    let nextPageToken = null;
    let currentQuery = '';
    let isLoadingMore = false;
    let currentTrackElement = null;

    // ========== КЭШИРОВАНИЕ ==========
    const STREAM_CACHE = new Map(); // videoId -> {url, expiresAt}
    const CACHE_TTL = 1000 * 60 * 30; // 30 минут

    function getCachedStream(videoId) {
        const cached = STREAM_CACHE.get(videoId);
        if (cached && Date.now() < cached.expiresAt) {
            return cached.url;
        }
        STREAM_CACHE.delete(videoId);
        return null;
    }

    function setCachedStream(videoId, url) {
        STREAM_CACHE.set(videoId, { url, expiresAt: Date.now() + CACHE_TTL });
    }

    // ========== ВИЗУАЛИЗАЦИЯ «ВОЛНЫ» ==========
    let audioContext = null;
    let analyser = null;
    let sourceNode = null;
    let canvasAnimationId = null;

    function setupVisualizer(audioElement) {
        const canvas = document.getElementById('waveCanvas');
        canvas.style.display = 'block';

        if (!audioContext) {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 2048;
            analyser.smoothingTimeConstant = 0.8;
            sourceNode = audioContext.createMediaElementSource(audioElement);
            sourceNode.connect(analyser);
            analyser.connect(audioContext.destination);
        }

        const bufferLength = analyser.frequencyBinCount;
        const dataArray = new Uint8Array(bufferLength);
        const canvasCtx = canvas.getContext('2d');

        // Адаптивный размер canvas под Retina
        const dpr = window.devicePixelRatio || 1;
        const rect = canvas.getBoundingClientRect();
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        canvasCtx.scale(dpr, dpr);

        function draw() {
            canvasAnimationId = requestAnimationFrame(draw);

            analyser.getByteTimeDomainData(dataArray);

            const WIDTH = rect.width;
            const HEIGHT = rect.height;

            canvasCtx.clearRect(0, 0, WIDTH, HEIGHT);
            canvasCtx.fillStyle = '#1a1a1a';
            canvasCtx.fillRect(0, 0, WIDTH, HEIGHT);

            // Рисуем центральную линию
            canvasCtx.strokeStyle = '#333';
            canvasCtx.lineWidth = 1;
            canvasCtx.beginPath();
            canvasCtx.moveTo(0, HEIGHT / 2);
            canvasCtx.lineTo(WIDTH, HEIGHT / 2);
            canvasCtx.stroke();

            // Рисуем волну
            canvasCtx.lineWidth = 2;
            canvasCtx.strokeStyle = '#1db954';
            canvasCtx.beginPath();

            const sliceWidth = WIDTH / bufferLength;
            let x = 0;

            for (let i = 0; i < bufferLength; i++) {
                const v = dataArray[i] / 128.0;
                const y = (v * HEIGHT) / 2;

                if (i === 0) {
                    canvasCtx.moveTo(x, y);
                } else {
                    canvasCtx.lineTo(x, y);
                }
                x += sliceWidth;
            }

            canvasCtx.stroke();
        }

        if (canvasAnimationId) cancelAnimationFrame(canvasAnimationId);
        draw();
    }

    // ========== ОСНОВНАЯ ЛОГИКА ==========
    function getBaseUrl() {
        return INSTANCES[currentInstanceIndex];
    }

    function rotateInstance() {
        currentInstanceIndex = (currentInstanceIndex + 1) % INSTANCES.length;
        setStatus(`Переключение на другой сервер (${getBaseUrl()})...`);
    }

    function setStatus(msg, isError = false) {
        const el = document.getElementById('status');
        el.textContent = msg;
        el.className = isError ? 'error' : '';
    }

    async function searchMusic(query, append = false) {
        if (isLoadingMore) return;

        if (!append) {
            currentQuery = query;
            nextPageToken = null;
            document.getElementById('results').innerHTML = '';
            document.getElementById('player').style.display = 'none';
            document.getElementById('waveCanvas').style.display = 'none';
            setStatus('Поиск...');
        } else {
            isLoadingMore = true;
            setStatus('Загрузка ещё...');
        }

        let url = `${getBaseUrl()}/search?q=${encodeURIComponent(query)}&filter=music_songs`;
        if (append && nextPageToken) {
            url += `&nextpage=${encodeURIComponent(nextPageToken)}`;
        }

        try {
            const res = await fetch(url);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const data = await res.json();

            const items = data.items || [];
            nextPageToken = data.nextpage || null;

            if (items.length === 0 && !append) {
                setStatus('Ничего не найдено.');
                isLoadingMore = false;
                return;
            }

            setStatus(append ? `Загружено ещё ${items.length}` : `Найдено: ${items.length}`);
            renderResults(items, append);
        } catch (err) {
            console.error(err);
            setStatus(`Ошибка: ${err.message}. Пробую другой сервер...`, true);
            rotateInstance();
            searchMusic(query, append);
        } finally {
            isLoadingMore = false;
        }
    }

    function renderResults(items, append) {
        const container = document.getElementById('results');
        if (!append) container.innerHTML = '';

        items.forEach(item => {
            const videoId = item.url ? item.url.split('v=')[1] : null;
            if (!videoId) return;

            const div = document.createElement('div');
            div.className = 'track';
            div.dataset.videoId = videoId;
            div.onclick = () => playTrack(videoId, item.title, div);

            const dur = item.duration ? formatDuration(item.duration) : '';

            div.innerHTML = `
                <img src="${item.thumbnail || ''}" alt="" loading="lazy" />
                <div class="info">
                    <div class="title">${escapeHtml(item.title || 'Неизвестно')}</div>
                    <div class="artist">${escapeHtml(item.uploaderName || 'Неизвестный исполнитель')}</div>
                </div>
                <div class="duration">${dur}</div>
            `;
            container.appendChild(div);
        });

        // Добавляем sentinel для бесконечной подгрузки
        const oldSentinel = document.getElementById('loadMoreSentinel');
        if (oldSentinel) oldSentinel.remove();

        if (nextPageToken) {
            const sentinel = document.createElement('div');
            sentinel.id = 'loadMoreSentinel';
            sentinel.className = 'loader';
            sentinel.textContent = 'Загрузка...';
            container.appendChild(sentinel);

            // Intersection Observer для автоматической подгрузки
            if (window.loadMoreObserver) window.loadMoreObserver.disconnect();
            window.loadMoreObserver = new IntersectionObserver((entries) => {
                if (entries[0].isIntersecting && nextPageToken && !isLoadingMore) {
                    searchMusic(currentQuery, true);
                }
            }, { rootMargin: '200px' });
            window.loadMoreObserver.observe(sentinel);
        }
    }

    async function playTrack(videoId, title, trackElement) {
        // Подсветка активного трека
        if (currentTrackElement) currentTrackElement.classList.remove('active');
        currentTrackElement = trackElement;
        if (trackElement) trackElement.classList.add('active');

        const player = document.getElementById('player');

        // Проверяем кэш
        const cachedUrl = getCachedStream(videoId);
        if (cachedUrl) {
            setStatus(`▶ ${title} (из кэша)`);
            player.src = cachedUrl;
            player.style.display = 'block';
            setupVisualizer(player);
            player.play();
            return;
        }

        setStatus(`Загрузка потока: ${title}...`);

        try {
            const res = await fetch(`${getBaseUrl()}/streams/${videoId}`);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const data = await res.json();

            const audioStreams = data.audioStreams || [];
            if (audioStreams.length === 0) throw new Error('Аудиопотоки не найдены');

            // Приоритет m4a для совместимости с браузером
            const m4a = audioStreams.filter(s => s.mimeType && s.mimeType.includes('mp4'));
            const candidates = m4a.length > 0 ? m4a : audioStreams;
            candidates.sort((a, b) => (b.bitrate || 0) - (a.bitrate || 0));

            const stream = candidates[0];

            // Сохраняем в кэш
            setCachedStream(videoId, stream.url);

            player.src = stream.url;
            player.style.display = 'block';
            setupVisualizer(player);
            player.play();

            const quality = stream.bitrate ? Math.round(stream.bitrate / 1000) + ' kbps' : '';
            setStatus(`▶ ${title} (${quality})`);
        } catch (err) {
            console.error(err);
            setStatus(`Ошибка воспроизведения: ${err.message}`, true);
            rotateInstance();
        }
    }

    function formatDuration(seconds) {
        const m = Math.floor(seconds / 60);
        const s = seconds % 60;
        return `${m}:${s.toString().padStart(2, '0')}`;
    }

    function escapeHtml(str) {
        return str.replace(/[&<>"']/g, c => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));
    }

    // ========== СОБЫТИЯ ==========
    document.getElementById('searchBtn').onclick = () => {
        const q = document.getElementById('query').value.trim();
        if (q) searchMusic(q);
    };

    document.getElementById('query').addEventListener('keydown', e => {
        if (e.key === 'Enter') {
            const q = e.target.value.trim();
            if (q) searchMusic(q);
        }
    });

    // Возобновление AudioContext при взаимодействии (требование браузеров)
    document.addEventListener('click', () => {
        if (audioContext && audioContext.state === 'suspended') {
            audioContext.resume();
        }
    }, { once: false });
</script>
</body>
</html>
