<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invidious Music Streamer</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 700px; margin: 0 auto; padding: 20px; background: #121212; color: #fff; }
        h1 { font-size: 1.5rem; margin-bottom: 16px; }
        .search-box { display: flex; gap: 8px; margin-bottom: 20px; }
        input { flex: 1; padding: 12px; border: none; border-radius: 8px; background: #282828; color: #fff; font-size: 16px; outline: none; }
        input:focus { background: #333; }
        button { padding: 12px 20px; border: none; border-radius: 8px; background: #1db954; color: #000; font-weight: 600; cursor: pointer; font-size: 16px; }
        button:hover { background: #1ed760; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        #status { color: #aaa; font-size: 14px; margin-bottom: 12px; min-height: 20px; }
        .track { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 8px; cursor: pointer; transition: background 0.15s; }
        .track:hover { background: #282828; }
        .track.active { background: #1db95422; border-left: 3px solid #1db954; }
        .track img { width: 48px; height: 48px; border-radius: 4px; object-fit: cover; }
        .track .info { flex: 1; min-width: 0; }
        .track .title { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .track .artist { font-size: 13px; color: #aaa; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .track .duration { font-size: 13px; color: #888; }
        #player { width: 100%; margin-top: 16px; border-radius: 8px; }
        #waveCanvas { width: 100%; height: 120px; margin-top: 16px; border-radius: 8px; background: #1a1a1a; display: none; }
        .error { color: #ff6b6b; }
    </style>
</head>
<body>
    <h1>🎵 Invidious Music Streamer</h1>
    <div class="search-box">
        <input type="text" id="query" placeholder="Поиск трека или исполнителя..." />
        <button id="searchBtn">Найти</button>
    </div>
    <div id="status"></div>
    <div id="results"></div>
    <audio id="player" controls style="display: none;"></audio>
    <canvas id="waveCanvas"></canvas>

<script>
    // Публичные инстансы Invidious (все нестабильны, пробуем по очереди)
    const INSTANCES = [
        'https://inv.thepixora.com',
        'https://invidious.nerdvpn.de',
        'https://inv.nadeko.net'
    ];

    let currentInstanceIndex = 0;
    let currentTrackElement = null;

    // Кэш потоков
    const STREAM_CACHE = new Map();
    const CACHE_TTL = 1000 * 60 * 30; // 30 минут

    function getCachedStream(videoId) {
        const cached = STREAM_CACHE.get(videoId);
        if (cached && Date.now() < cached.expiresAt) return cached.url;
        STREAM_CACHE.delete(videoId);
        return null;
    }

    function setCachedStream(videoId, url) {
        STREAM_CACHE.set(videoId, { url, expiresAt: Date.now() + CACHE_TTL });
    }

    // ========== ВИЗУАЛИЗАЦИЯ «ВОЛНЫ» ==========
    let audioContext = null;
    let analyser = null;
    let sourceNode = null;
    let canvasAnimationId = null;

    function setupVisualizer(audioElement) {
        const canvas = document.getElementById('waveCanvas');
        canvas.style.display = 'block';

        if (!audioContext) {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 2048;
            analyser.smoothingTimeConstant = 0.8;
            sourceNode = audioContext.createMediaElementSource(audioElement);
            sourceNode.connect(analyser);
            analyser.connect(audioContext.destination);
        }

        const bufferLength = analyser.frequencyBinCount;
        const dataArray = new Uint8Array(bufferLength);
        const canvasCtx = canvas.getContext('2d');

        const dpr = window.devicePixelRatio || 1;
        const rect = canvas.getBoundingClientRect();
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        canvasCtx.scale(dpr, dpr);

        function draw() {
            canvasAnimationId = requestAnimationFrame(draw);
            analyser.getByteTimeDomainData(dataArray);

            const WIDTH = rect.width;
            const HEIGHT = rect.height;

            canvasCtx.clearRect(0, 0, WIDTH, HEIGHT);
            canvasCtx.fillStyle = '#1a1a1a';
            canvasCtx.fillRect(0, 0, WIDTH, HEIGHT);

            canvasCtx.strokeStyle = '#333';
            canvasCtx.lineWidth = 1;
            canvasCtx.beginPath();
            canvasCtx.moveTo(0, HEIGHT / 2);
            canvasCtx.lineTo(WIDTH, HEIGHT / 2);
            canvasCtx.stroke();

            canvasCtx.lineWidth = 2;
            canvasCtx.strokeStyle = '#1db954';
            canvasCtx.beginPath();

            const sliceWidth = WIDTH / bufferLength;
            let x = 0;

            for (let i = 0; i < bufferLength; i++) {
                const v = dataArray[i] / 128.0;
                const y = (v * HEIGHT) / 2;
                if (i === 0) canvasCtx.moveTo(x, y);
                else canvasCtx.lineTo(x, y);
                x += sliceWidth;
            }
            canvasCtx.stroke();
        }

        if (canvasAnimationId) cancelAnimationFrame(canvasAnimationId);
        draw();
    }

    // ========== ОСНОВНАЯ ЛОГИКА ==========
    function getBaseUrl() {
        return INSTANCES[currentInstanceIndex];
    }

    function rotateInstance() {
        currentInstanceIndex = (currentInstanceIndex + 1) % INSTANCES.length;
        setStatus(`Переключение на другой сервер (${getBaseUrl()})...`);
    }

    function setStatus(msg, isError = false) {
        const el = document.getElementById('status');
        el.textContent = msg;
        el.className = isError ? 'error' : '';
    }

    async function searchMusic(query) {
        document.getElementById('results').innerHTML = '';
        document.getElementById('player').style.display = 'none';
        document.getElementById('waveCanvas').style.display = 'none';
        setStatus('Поиск...');

        // Invidious использует операторы для фильтрации [citation:2]
        const searchQuery = `${query} type:video sort:relevance`;
        const url = `${getBaseUrl()}/api/v1/search?q=${encodeURIComponent(searchQuery)}`;

        try {
            const res = await fetch(url);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const data = await res.json();

            if (data.length === 0) {
                setStatus('Ничего не найдено.');
                return;
            }

            setStatus(`Найдено: ${data.length}`);
            renderResults(data);
        } catch (err) {
            console.error(err);
            setStatus(`Ошибка: ${err.message}. Пробую другой сервер...`, true);
            rotateInstance();
            searchMusic(query);
        }
    }

    function renderResults(items) {
        const container = document.getElementById('results');
        container.innerHTML = '';

        items.forEach(item => {
            if (item.type !== 'video') return; // Только видео/треки

            const div = document.createElement('div');
            div.className = 'track';
            div.dataset.videoId = item.videoId;
            div.onclick = () => playTrack(item.videoId, item.title, div);

            const dur = item.lengthSeconds ? formatDuration(item.lengthSeconds) : '';

            div.innerHTML = `
                <img src="${item.videoThumbnails?.[0]?.url || ''}" alt="" loading="lazy" />
                <div class="info">
                    <div class="title">${escapeHtml(item.title || 'Неизвестно')}</div>
                    <div class="artist">${escapeHtml(item.author || 'Неизвестный исполнитель')}</div>
                </div>
                <div class="duration">${dur}</div>
            `;
            container.appendChild(div);
        });
    }

    async function playTrack(videoId, title, trackElement) {
        if (currentTrackElement) currentTrackElement.classList.remove('active');
        currentTrackElement = trackElement;
        if (trackElement) trackElement.classList.add('active');

        const player = document.getElementById('player');

        const cachedUrl = getCachedStream(videoId);
        if (cachedUrl) {
            setStatus(`▶ ${title} (из кэша)`);
            player.src = cachedUrl;
            player.style.display = 'block';
            setupVisualizer(player);
            player.play();
            return;
        }

        setStatus(`Загрузка потока: ${title}...`);

        try {
            const res = await fetch(`${getBaseUrl()}/api/v1/videos/${videoId}`);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const data = await res.json();

            // Invidious возвращает потоки в adaptiveFormats или audioStreams
            const formats = data.adaptiveFormats || data.audioStreams || [];
            const audioOnly = formats.filter(f => f.type && f.type.includes('audio'));

            if (audioOnly.length === 0) throw new Error('Аудиопотоки не найдены');

            // Сортируем по битрейту (убывание)
            audioOnly.sort((a, b) => (parseInt(b.bitrate) || 0) - (parseInt(a.bitrate) || 0));
            const stream = audioOnly[0];

            setCachedStream(videoId, stream.url);

            player.src = stream.url;
            player.style.display = 'block';
            setupVisualizer(player);
            player.play();

            const quality = stream.bitrate ? Math.round(parseInt(stream.bitrate) / 1000) + ' kbps' : '';
            setStatus(`▶ ${title} (${quality})`);
        } catch (err) {
            console.error(err);
            setStatus(`Ошибка воспроизведения: ${err.message}`, true);
            rotateInstance();
        }
    }

    function formatDuration(seconds) {
        const m = Math.floor(seconds / 60);
        const s = seconds % 60;
        return `${m}:${s.toString().padStart(2, '0')}`;
    }

    function escapeHtml(str) {
        return str.replace(/[&<>"']/g, c => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));
    }

    // События
    document.getElementById('searchBtn').onclick = () => {
        const q = document.getElementById('query').value.trim();
        if (q) searchMusic(q);
    };

    document.getElementById('query').addEventListener('keydown', e => {
        if (e.key === 'Enter') {
            const q = e.target.value.trim();
            if (q) searchMusic(q);
        }
    });

    document.addEventListener('click', () => {
        if (audioContext && audioContext.state === 'suspended') {
            audioContext.resume();
        }
    });
</script>
</body>
</html>
