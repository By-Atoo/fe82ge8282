<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>НИИ «КОСМОС-84» // ЭФИР-7</title>
    <style>
        :root {
            --glow: #00ff66;
            --dim: #004411;
            --bg: #050a05;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
        }

        body {
            background-color: var(--bg);
            color: var(--glow);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            text-shadow: 0 0 8px rgba(0, 255, 102, 0.6);
        }

        /* Эффект старого CRT-экрана */
        .crt-container {
            width: 95vw;
            height: 90vh;
            max-width: 1000px;
            border: 20px solid #1a1a1a;
            border-radius: 40px;
            position: relative;
            background: #020d04;
            box-shadow: inset 0 0 100px rgba(0,0,0,0.9), 0 0 50px rgba(0,255,102,0.1);
            overflow: hidden;
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Линии сканирования экрана */
        .scanlines {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.25) 50%
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 10;
        }

        /* Выпуклость и блики */
        .crt-glass {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.03) 0%, rgba(0,0,0,0.5) 90%);
            pointer-events: none;
            z-index: 11;
        }

        header {
            border-bottom: 2px solid var(--glow);
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .terminal-body {
            flex-grow: 1;
            margin: 20px 0;
            overflow-y: auto;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .log-entry {
            margin-bottom: 8px;
            opacity: 0;
            animation: fadeIn 0.1s forwards;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        .radar-box {
            position: absolute;
            top: 80px;
            right: 40px;
            width: 140px;
            height: 140px;
            border: 1px solid var(--glow);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.7;
        }

        .radar-sweep {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(from 0deg, transparent 80%, var(--glow));
            animation: spin 4s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .controls {
            border-top: 1px dashed var(--glow);
            padding-top: 15px;
            display: flex;
            gap: 15px;
        }

        input {
            background: transparent;
            border: none;
            color: var(--glow);
            font-family: inherit;
            font-size: 1rem;
            flex-grow: 1;
            outline: none;
            text-shadow: 0 0 8px rgba(0, 255, 102, 0.6);
        }

        .btn {
            background: var(--dim);
            color: var(--glow);
            border: 1px solid var(--glow);
            padding: 5px 15px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
        }

        .btn:hover {
            background: var(--glow);
            color: var(--bg);
            box-shadow: 0 0 10px var(--glow);
        }

        /* Эффект мерцания экрана при сбоях */
        .glitch {
            animation: glitch-anim 0.2s 3;
        }

        @keyframes glitch-anim {
            0% { transform: translate(0) }
            20% { transform: translate(-3px, 3px) }
            40% { transform: translate(-3px, -3px) }
            60% { transform: translate(3px, 3px) }
            80% { transform: translate(3px, -3px) }
            100% { transform: translate(0) }
        }
    </style>
</head>
<body>

<div class="crt-container" id="terminal">
    <div class="scanlines"></div>
    <div class="crt-glass"></div>

    <header>
        <span>[ СТАНЦИЯ ЭФИР-7 ]</span>
        <span id="clock">00:00:00</span>
        <span>СТАТУС: АНОМАЛИЯ</span>
    </header>

    <div class="radar-box">
        <div class="radar-sweep"></div>
        <div style="width: 4px; height: 4px; background: var(--glow); border-radius: 50%;"></div>
    </div>

    <div class="terminal-body" id="output">
        <div class="log-entry">>>>> ИНИЦИАЛИЗАЦИЯ БОРТОВОЙ СИСТЕМЫ 1984.09.12...</div>
        <div class="log-entry">>>>> СВЯЗЬ С ЗЕМЛЕЙ УТЕРЯНА 14 209 ДНЕЙ НАЗАД.</div>
        <div class="log-entry">>>>> ОБНАРУЖЕН НЕОПОЗНАННЫЙ СИГНАЛ В СЕКТОРЕ 12-Б.</div>
        <div class="log-entry" style="color: #ffaa00;">>>>> ВНИМАНИЕ: Для взаимодействия кликните в любом месте и введите команду (попробуйте 'помощь').</div>
    </div>

    <div class="controls">
        <span>&gt;</span>
        <input type="text" id="commandInput" placeholder="Введите команду..." autofocus autocomplete="off">
        <button class="btn" onclick="handleCommand()">ОТПРАВКА</button>
    </div>
</div>

<script>
    // Генерация ламповых звуков клавиатуры и кликов на лету (без внешних файлов)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playBeep(freq = 800, type = 'sine', duration = 0.05) {
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    }

    // Часы терминала
    setInterval(() => {
        const now = new Date();
        document.getElementById('clock').innerText = now.toTimeString().split(' ')[0];
    }, 1000);

    const input = document.getElementById('commandInput');
    const output = document.getElementById('output');
    const terminal = document.getElementById('terminal');

    // Озвучка ввода
    input.addEventListener('keydown', (e) => {
        playBeep(400 + Math.random() * 200, 'square', 0.03);
        if (e.key === 'Enter') {
            handleCommand();
        }
    });

    // Реакция на клик по экрану
    document.body.addEventListener('click', () => {
        if (audioCtx.state === 'suspended') audioCtx.resume();
    });

    function printLog(text, color = 'var(--glow)') {
        const div = document.createElement('div');
        div.className = 'log-entry';
        div.style.color = color;
        div.innerText = `> ${text}`;
        output.appendChild(div);
        output.scrollTop = output.scrollHeight;
    }

    function triggerGlitch() {
        terminal.classList.add('glitch');
        playBeep(150, 'sawtooth', 0.2);
        setTimeout(() => terminal.classList.remove('glitch'), 600);
    }

    // База команд
    function handleCommand() {
        const cmd = input.value.trim().toLowerCase();
        if (!cmd) return;

        printLog(input.value, '#ffffff');
        input.value = '';

        setTimeout(() => {
            switch(cmd) {
                case 'помощь':
                case 'help':
                    printLog('ДОСТУПНЫЕ КОМАНДЫ:');
                    printLog('  статус   - проверка систем корабля');
                    printLog('  скан     - сканирование сектора');
                    printLog('  дневник  - последние записи бортового журнала');
                    printLog('  сигнал   - попытка расшифровать аномалию');
                    printLog('  очистить - очистка экрана');
                    break;

                case 'статус':
                    printLog('КИСЛОРОД: 12% (КРИТИЧЕСКИ)');
                    printLog('ОБШИВКА: 88%');
                    printLog('РЕАКТОР: РАБОТАЕТ В АВАРИЙНОМ РЕЖИМЕ');
                    printLog('ЭКИПАЖ: 0 ЧЕЛОВЕК (ОБНАРУЖЕНЫ БИОМАРСКЕРЫ...)', '#ffaa00');
                    break;

                case 'скан':
                    printLog('СКАНИРОВАНИЕ...');
                    triggerGlitch();
                    setTimeout(() => {
                        printLog('ОБНАРУЖЕН ОБЪЕКТ МАССИВНОГО РАЗМЕРА НА ДИСТАНЦИИ 400 КМ.');
                        printLog('ФОРМА: НЕПРАВИЛЬНАЯ. МАТЕРИАЛ: НЕОПРЕДЕЛЕН.', '#ff3333');
                    }, 1000);
                    break;

                case 'дневник':
                    printLog('ЗАПИСЬ #412: "Оно не агрессивно. Оно просто поет на частоте 1420 МГц..."');
                    printLog('ЗАПИСЬ #413: "Капитан вышел в открытый космос без скафандра. Он улыбался."');
                    break;

                case 'сигнал':
                    triggerGlitch();
                    printLog('ПРИЕМ СИГНАЛА:', '#ffaa00');
                    printLog('"... . . . -- . . . -.-. .- -- . ... ... .- --. . . . . . . .."');
                    playBeep(900, 'sine', 0.4);
                    setTimeout(() => playBeep(300, 'sine', 0.6), 400);
                    break;

                case 'очистить':
                case 'cls':
                case 'clear':
                    output.innerHTML = '';
                    break;

                default:
                    printLog(`ОШИБКА: Команда "${cmd}" не распознана. Введите 'помощь'.`, '#ff3333');
                    triggerGlitch();
                    break;
            }
        }, 200);
    }
</script>
</body>
</html>
